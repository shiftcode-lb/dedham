<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google tag (gtag.js) — GA4 only. The Google Ads remarketing pixel
         (AW-16623859488) was removed: it had no conversion action configured
         so it wasn't measuring anything, but it loaded a third-party
         tracking cookie on every page load, hurting Best Practices and
         Performance. Re-add it as `gtag('event', 'conversion', {send_to:
         'AW-16623859488/<LABEL>'})` at an actual conversion moment (booking
         success, call click) once a conversion action + label exist. -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-7VZH8F8PP6"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-7VZH8F8PP6");
    </script>

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Preload the LCP hero image so the browser can fetch it before React
         renders (this is a client-rendered SPA, so without this the image
         request wouldn't start until after the JS bundle parses and runs) -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-1376.webp"
      imagesrcset="/images/hero-640.webp 640w, /images/hero-1024.webp 1024w, /images/hero-1376.webp 1376w"
      imagesizes="100vw"
      fetchpriority="high"
    />

   
    <!-- Primary SEO -->
    <title>Dedham Airport Taxi & Car Service | Logan Airport Transportation</title>

    <meta
      name="description"
      content="Book reliable Dedham airport taxi and car service to Boston Logan Airport. Professional airport transportation, private rides, corporate travel, and local car service in Dedham, MA."
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://dedhamairporttaxi.com/"
    />

    <!-- Robots -->
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Dedham Airport Taxi & Car Service | Logan Airport Transportation"
    />

    <meta
      property="og:description"
      content="Reliable airport taxi and professional car service from Dedham, MA to Boston Logan Airport. Book your ride today."
    />

    <meta
      property="og:url"
      content="https://dedhamairporttaxi.com/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Dedham Airport Taxi & Livery"
    />

    <meta
      property="og:image"
      content="https://dedhamairporttaxi.com/og-image.webp"
    />

    <!-- Twitter / Social -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Dedham Airport Taxi & Car Service | Logan Airport Transportation"
    />

    <meta
      name="twitter:description"
      content="Reliable airport taxi and professional car service from Dedham, MA to Boston Logan Airport. Book your ride today."
    />

    <meta
      name="twitter:image"
      content="https://dedhamairporttaxi.com/og-image.webp"
    />

    <!-- Browser Tab Logo -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
